plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'io.dcloud.uts.kotlin'
}

android {
    namespace 'io.dcloud.uniappx.offline'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }
}

dependencies {
    implementation project(':uts-fnos-auth')
    // VDOM: aars are packaged by the app module, so compileOnly is enough here
    compileOnly fileTree(dir: 'libs', include: ['app-common-release.aar', 'app-runtime-release.aar', 'breakpad-build-release.aar', 'uts-runtime-release.aar', 'dcloud-layout-release.aar', 'framework-release.aar', 'android-gif-drawable-1.2.30.aar', 'uni-exit-release.aar', 'uni-getAccessibilityInfo-release.aar', 'uni-getAppAuthorizeSetting-release.aar', 'uni-getAppBaseInfo-release.aar', 'uni-getSystemSetting-release.aar', 'uni-openAppAuthorizeSetting-release.aar', 'uni-prompt-release.aar', 'uni-storage-release.aar', 'uni-getDeviceInfo-release.aar', 'uni-getSystemInfo-release.aar', 'uni-rpx2px-release.aar', 'uni-theme-release.aar', 'uni-convert2AbsFullPath-release.aar', 'uni-video-release.aar'])

    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.webkit:webkit:1.6.0"
    implementation "com.google.android.material:material:1.10.0"
    implementation "com.alibaba:fastjson:1.2.83"
    implementation "com.facebook.fresco:fresco:3.4.0"
    implementation "com.facebook.fresco:middleware:3.4.0"
    implementation "com.facebook.fresco:animated-gif:3.4.0"
    implementation "com.facebook.fresco:webpsupport:3.4.0"
    implementation "com.facebook.fresco:animated-webp:3.4.0"
    implementation "com.caverock:androidsvg:1.4"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
    implementation "com.squareup.okhttp3:okhttp:3.12.12"
    implementation "net.lingala.zip4j:zip4j:2.11.5"
}
