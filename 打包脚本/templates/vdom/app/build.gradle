plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    id 'io.dcloud.uts.kotlin'
}

// Business params come from gradle.properties (written by the packaging script)
def appPkg   = (project.findProperty('appPackage')     ?: 'com.example.uniappx').toString()
def abiList  = (project.findProperty('abiFilters')     ?: 'arm64-v8a').toString().split(',')*.trim()
def verCode  = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def verName  = (project.findProperty('appVersionName') ?: '1.0').toString()

// Signing config: keystore/keystore.properties is generated by the packaging script
def ksPropsFile = rootProject.file('keystore/keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}
def ksStorePath = ksProps.getProperty('storeFile')

android {
    lint {
        // 离线包不走 Google Play，关掉 release 的 lintVital，避免 ExpiredTargetSdkVersion 之类阻断构建
        checkReleaseBuilds false
        abortOnError false
    }
    namespace appPkg
    compileSdk 36

    defaultConfig {
        applicationId appPkg
        minSdk 21
        targetSdk 32
        versionCode verCode
        versionName verName

        ndk {
            abiFilters(*abiList)
        }

        buildFeatures {
            buildConfig true
        }
        multiDexEnabled true

        // uni-app x ext-api 组件注册表（离线打包必须自己声明，HBuilderX 基座里是内置的）。
        // 不写这段，resolveComponent("video") 返回 null，<video> 会退化成裸 UniElementImpl：
        // 画面全黑、createVideoContext 抛 ClassCastException、本机代理收不到任何请求。
        // 格式与官方 SDK demo（uniappxnativepackage/app/build.gradle 的 UTSEasyCom）一致。
        buildConfigField 'String', 'UTSEasyCom', '\"[{\\\"class\\\":\\\"uts.sdk.modules.DCloudUniVideo.UniVideoExtApiComponentsRegister\\\",\\\"method\\\":\\\"register\\\"}]\"'
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists() && ksStorePath) {
                storeFile rootProject.file(ksStorePath)
                storePassword ksProps.getProperty('storePassword')
                keyAlias ksProps.getProperty('keyAlias')
                keyPassword ksProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksPropsFile.exists() && ksStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE*'
            excludes += 'META-INF/NOTICE*'
        }
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation project(':uts-fnos-auth')
    implementation project(':uniappx')
    // uni-app x runtime aars (same set and excludes as the official SDK demo project)
    implementation fileTree(dir: '../uniappx/libs', include: ['app-common-release.aar', 'app-runtime-release.aar', 'breakpad-build-release.aar', 'uts-runtime-release.aar', 'dcloud-layout-release.aar', 'framework-release.aar', 'android-gif-drawable-1.2.30.aar', 'uni-exit-release.aar', 'uni-getAccessibilityInfo-release.aar', 'uni-getAppAuthorizeSetting-release.aar', 'uni-getAppBaseInfo-release.aar', 'uni-getSystemSetting-release.aar', 'uni-openAppAuthorizeSetting-release.aar', 'uni-prompt-release.aar', 'uni-storage-release.aar', 'uni-getDeviceInfo-release.aar', 'uni-getSystemInfo-release.aar', 'uni-rpx2px-release.aar', 'uni-theme-release.aar', 'uni-convert2AbsFullPath-release.aar', 'uni-video-release.aar'])

    implementation "androidx.tracing:tracing-ktx:1.3.0"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    implementation "com.google.android.material:material:1.10.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.webkit:webkit:1.6.0"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.0.0@aar"
    implementation "androidx.media:media:1.4.3"

    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.4.1"

    implementation "com.facebook.fresco:fresco:3.4.0"
    implementation "com.facebook.fresco:animated-base:3.4.0"
    implementation "com.facebook.fresco:animated-gif:3.4.0"
    implementation "com.facebook.fresco:animated-webp:3.4.0"
    implementation "com.facebook.fresco:webpsupport:3.4.0"
    implementation "com.facebook.fresco:imagepipeline:3.4.0"
    implementation "com.facebook.fresco:drawee:3.4.0"
    implementation "com.facebook.fresco:middleware:3.4.0"

    implementation "com.caverock:androidsvg:1.4"

    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "com.alibaba:fastjson:1.2.83"
    implementation "com.github.getActivity:XXPermissions:18.63"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "com.squareup.okhttp3:okhttp:3.12.12"
    implementation "net.lingala.zip4j:zip4j:2.11.5"

    // video playback (uni-video module)
    implementation "com.google.android.exoplayer:exoplayer-core:2.18.0"
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
}
