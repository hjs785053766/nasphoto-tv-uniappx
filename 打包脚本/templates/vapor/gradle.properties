org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.enableJetifier=true

# ---- business params, written by the packaging script ----
# appPackage must match the Android package name configured in HBuilderX manifest.json
appPackage=com.example.uniappx
appVersionCode=1
appVersionName=1.0
# arm64-v8a covers modern phones; use "arm64-v8a,armeabi-v7a" for older devices
abiFilters=arm64-v8a