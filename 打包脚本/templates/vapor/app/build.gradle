plugins {
    alias(libs.plugins.android.application)
    id 'io.dcloud.uts.kotlin'
    // Vapor mode only
    id 'io.dcloud.uts.auto-register'
}

// Business params come from gradle.properties (written by the packaging script)
def appPkg   = (project.findProperty('appPackage')     ?: 'com.example.uniappx').toString()
def abiList  = (project.findProperty('abiFilters')     ?: 'arm64-v8a').toString().split(',')*.trim()
def verCode  = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def verName  = (project.findProperty('appVersionName') ?: '1.0').toString()

// Signing config: keystore/keystore.properties is generated by the packaging script
def ksPropsFile = rootProject.file('keystore/keystore.properties')
def ksProps = new Properties()
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}
def ksStorePath = ksProps.getProperty('storeFile')

android {
    lint {
        // 离线包不走 Google Play，关掉 release 的 lintVital，避免 ExpiredTargetSdkVersion 之类阻断构建
        checkReleaseBuilds false
        abortOnError false
    }
    namespace appPkg
    compileSdk { version = release(36) }

    defaultConfig {
        applicationId appPkg
        minSdk 24
        targetSdk 36
        versionCode verCode
        versionName verName

        ndk {
            abiFilters(*abiList)
        }

        android.buildFeatures.buildConfig true
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists() && ksStorePath) {
                storeFile rootProject.file(ksStorePath)
                storePassword ksProps.getProperty('storePassword')
                keyAlias ksProps.getProperty('keyAlias')
                keyPassword ksProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Keep R8 / resource shrinking off: uni-app x aars are not guaranteed to survive obfuscation
            optimization {
                enable false
            }
            if (ksPropsFile.exists() && ksStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress "uni-app-x-framework-vapor", "uni-app-x-framework-vapor-dev", "js"
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }

    aaptOptions {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }

    packagingOptions {
        pickFirst 'lib/*/libstlport_shared.so'
        pickFirst 'lib/*/libc++_shared.so'
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation project(':uniappx')
    // uni-app x runtime aars live in uniappx/libs
    implementation fileTree(include: ['*.aar'], dir: '../uniappx/libs')

    implementation "androidx.tracing:tracing-ktx:1.3.0"
    implementation "androidx.core:core-ktx:1.10.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    implementation "com.google.android.material:material:1.10.0"

    implementation "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    implementation "com.facebook.fresco:fresco:3.4.0"
    implementation "com.facebook.fresco:animated-base:3.4.0"
    implementation "com.facebook.fresco:animated-gif:3.4.0"
    implementation "com.facebook.fresco:animated-webp:3.4.0"
    implementation "com.facebook.fresco:webpsupport:3.4.0"
    implementation "com.facebook.fresco:imagepipeline:3.4.0"
    implementation "com.facebook.fresco:drawee:3.4.0"
    implementation "com.facebook.fresco:middleware:3.4.0"

    implementation "com.caverock:androidsvg:1.4"
    implementation "com.alibaba:fastjson:1.2.83"
    implementation "com.github.getActivity:XXPermissions:18.63"
    implementation "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "com.squareup.okhttp3:okhttp:3.12.12"
}
